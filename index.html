<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第七场 · 短片合作平台</title>
<style>
  :root{
    --bg:#080C0B; --panel:#0E1513; --panel2:#121B18; --panel3:#0A100E;
    --line:rgba(230,237,233,.10); --line2:rgba(230,237,233,.18);
    --ink:#E6EDE9; --dim:#93A29B; --dimmer:#7F8E87;
    --mint:#6FE3A8; --sand:#C8A46A; --red:#E4572E;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
    --sans:"Noto Sans SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
  input,textarea,select{font:inherit}
  img{display:block}

  /* bar */
  .bar{height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
  .brand i{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px rgba(111,227,168,.7)}
  .brand span{color:#9BA9A2;font-weight:500;font-size:12px;letter-spacing:.05em}
  .role{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden;margin-left:6px}
  .role button{padding:6px 12px;font-size:12px;color:var(--dim)}
  .role button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--mint)}
  .bar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .ghost{font-size:12px;color:var(--dim);white-space:nowrap}
  .solid{font-size:12px;font-weight:700;color:#04120C;background:var(--mint);padding:8px 14px;border-radius:3px;white-space:nowrap}
  .solid.line{background:none;color:var(--mint);border:1px solid rgba(111,227,168,.55)}

  /* shell */
  .shell{display:grid;grid-template-columns:208px 1fr;height:calc(100vh - 56px);min-height:0}
  .rail{border-right:1px solid var(--line);background:var(--panel);padding:16px 0;overflow-y:auto}
  .rail h2{margin:0 0 8px;padding:0 16px;font-size:11px;letter-spacing:.2em;color:var(--dimmer);font-weight:600}
  .rail nav{display:flex;flex-direction:column;margin-bottom:20px}
  .nav-i{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;font-size:12.5px;color:var(--dim);border-left:2px solid transparent;gap:8px}
  .nav-i b{font-family:var(--mono);font-size:11px;color:var(--dimmer);font-weight:400}
  .nav-i:hover{color:var(--ink);background:rgba(255,255,255,.02)}
  .nav-i[aria-pressed="true"]{color:var(--ink);background:var(--panel2);border-left-color:var(--mint);font-weight:600}
  .nav-i[aria-pressed="true"] b{color:var(--mint)}
  .rail .role{margin:0;width:100%;display:flex}
  .rail .role button{flex:1;text-align:center;padding:6px 4px;font-size:11.5px}
  .rail .who{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--dimmer);line-height:1.9}
  .rail .who b{color:var(--sand);font-weight:600}

  /* stage */
  .stage{overflow-y:auto;padding:20px 26px 44px}
  .head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .head h1{margin:0;font-size:19px;font-weight:700}
  .head .count{font-family:var(--mono);font-size:11.5px;color:var(--dimmer)}
  .head .right{margin-left:auto;font-size:11.5px;color:var(--dimmer)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:18px}
  .card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:border-color .16s,transform .16s}
  .card:hover{border-color:rgba(111,227,168,.45);transform:translateY(-2px)}
  .cover{position:relative;aspect-ratio:16/10;background:var(--panel3);overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;opacity:.92}
  .cover .tag{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:11px;color:#EAF6F0;background:rgba(8,12,11,.62);border:1px solid rgba(230,237,233,.16);border-radius:2px;padding:2px 6px}
  .meta{padding:12px 14px 13px}
  .meta h3{margin:0;font-size:14.5px;font-weight:600}
  .meta .row{display:flex;gap:7px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
  .meta .row i{font-style:normal;color:var(--dimmer)}
  .meta .price{margin-top:9px;display:flex;align-items:baseline;gap:7px;font-size:12px;color:var(--dim)}
  .meta .price b{font-size:15px;color:var(--ink);font-weight:700;font-family:var(--mono)}
  .meta .price span{font-size:11px;color:var(--dimmer)}

  /* case detail */
  .back{display:inline-flex;gap:7px;font-size:12px;color:var(--dim);margin-bottom:14px}
  .back:hover{color:var(--ink)}
  .dhead{display:flex;align-items:flex-end;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .dhead h2{margin:0;font-size:24px;font-weight:700}
  .dhead .sub{font-size:12px;color:var(--dim);margin-bottom:3px}
  .dhead .acts{margin-left:auto;display:flex;gap:10px;align-items:center}
  .dbody{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start;margin-top:16px}
  .sb-head{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
  .sb-head h3{margin:0;font-size:12px;letter-spacing:.16em;color:var(--dimmer);font-weight:600}
  .sb-head .hint{margin-left:auto;font-size:11px;color:var(--dimmer)}
  .shot{display:grid;grid-template-columns:42px 82px 1fr 52px;gap:11px;align-items:center;width:100%;
        padding:8px 10px 8px 8px;border-bottom:1px solid rgba(230,237,233,.07);border-left:2px solid transparent}
  .shot:hover{background:rgba(255,255,255,.025)}
  .shot[aria-current="true"]{background:var(--panel2);border-left-color:var(--mint)}
  .shot .no{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
  .shot[aria-current="true"] .no{color:var(--mint)}
  .thumb{width:82px;height:47px;border-radius:2px;overflow:hidden;background:var(--panel3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb span{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
  .shot .txt b{display:block;font-size:12.5px;font-weight:600}
  .shot .txt em{display:block;font-style:normal;font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:500px}
  .shot .dur{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}

  /* quote card */
  .quote{margin-top:22px;border:1px solid rgba(111,227,168,.28);border-radius:4px;background:linear-gradient(180deg,rgba(111,227,168,.05),transparent 60%)}
  .q-top{display:flex;align-items:flex-end;gap:14px;padding:14px 16px 12px;border-bottom:1px solid rgba(230,237,233,.08);flex-wrap:wrap}
  .q-top .k{font-size:11px;letter-spacing:.16em;color:var(--dimmer)}
  .q-top strong{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.01em}
  .q-top strong i{font-style:normal;font-size:12px;font-weight:500;color:var(--dim);margin-left:3px}
  .q-top .spec{margin-left:auto;font-size:11.5px;color:var(--dim);text-align:right;line-height:1.7}
  .q-items{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:0}
  .qi{padding:11px 14px;border-right:1px solid rgba(230,237,233,.07)}
  .qi:last-child{border-right:0}
  .qi span{display:block;font-size:11px;color:var(--dimmer)}
  .qi b{display:block;font-family:var(--mono);font-size:12.5px;margin-top:3px}
  .q-flow{display:flex;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid rgba(230,237,233,.07);font-size:11.5px;color:var(--dim);flex-wrap:wrap}
  .q-flow b{color:var(--ink);font-weight:600}
  .q-flow i{font-style:normal;color:var(--dimmer)}
  .q-act{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid rgba(230,237,233,.07)}
  .q-act .note{font-size:11px;color:var(--dimmer);line-height:1.6}

  /* comments */
  .cmt{margin-top:24px}
  .cmt h3{margin:0 0 10px;font-size:12px;letter-spacing:.16em;color:var(--dimmer);font-weight:600}
  .cmt-list{display:flex;flex-direction:column;gap:0}
  .cmt-i{padding:11px 0;border-bottom:1px solid rgba(230,237,233,.07)}
  .cmt-i .who{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);margin-bottom:5px}
  .cmt-i .who b{color:var(--ink);font-weight:600}
  .cmt-i .who .badge{font-family:var(--mono);font-size:11px;color:var(--mint);border:1px solid rgba(111,227,168,.4);border-radius:2px;padding:1px 5px}
  .cmt-i p{margin:0;font-size:12.5px;color:#C8D3CE;line-height:1.75}
  .cmt-i.reply{margin-left:18px;border-left:1px solid rgba(111,227,168,.25);padding-left:14px}
  .cmt-form{margin-top:14px;border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--panel)}
  .cmt-form textarea{width:100%;min-height:64px;resize:vertical;background:var(--panel3);border:1px solid var(--line);border-radius:3px;padding:9px 10px;color:var(--ink);font-size:12.5px;outline:0}
  .cmt-form textarea:focus{border-color:rgba(111,227,168,.5)}
  .cmt-form .foot{display:flex;align-items:center;gap:10px;margin-top:9px}
  .cmt-form .foot span{margin-left:auto;font-size:11px;color:var(--dimmer)}

  /* prompt panel */
  .panel{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:14px 16px 16px;position:sticky;top:0}
  .panel h3{margin:0;font-size:12px;letter-spacing:.16em;color:var(--dimmer);font-weight:600}
  .panel .ph{display:flex;align-items:baseline;gap:8px;margin:2px 0 10px}
  .panel .ph b{font-size:14px;font-weight:600}
  .panel .ph span{font-family:var(--mono);font-size:11px;color:var(--mint)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid rgba(230,237,233,.06);font-size:11.5px}
  .kv k{color:var(--dim)}
  .kv v{font-family:var(--mono);font-size:11px;color:#D6E2DC}
  .lbl{margin:13px 0 6px;font-size:11px;letter-spacing:.14em;color:var(--dimmer)}
  .prompt{margin:0;background:var(--panel3);border:1px solid var(--line);border-radius:3px;padding:10px 11px;
          font-family:var(--mono);font-size:11px;line-height:1.85;color:#B9C7C1;white-space:pre-wrap;word-break:break-word}
  .neg{color:#9AA7A1;font-size:11px;line-height:1.8;padding:9px 11px;border:1px dashed rgba(230,237,233,.12);border-radius:3px;background:rgba(200,164,106,.05)}
  .copy{width:100%;margin-top:12px;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:8px;text-align:center;font-size:12px;font-weight:600}
  .copy:hover{border-color:var(--mint);color:var(--mint)}

  /* rfq */
  .rfq{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:4px;background:var(--panel);margin-bottom:12px;transition:border-color .16s}
  .rfq:hover{border-color:rgba(111,227,168,.4)}
  .rfq h3{margin:0;font-size:14.5px;font-weight:600}
  .rfq .row{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
  .rfq .row i{font-style:normal;color:var(--dimmer)}
  .rfq .row .b{color:var(--sand)}
  .rfq .side2{text-align:right;font-size:11px;color:var(--dimmer);line-height:1.8}
  .rfq .side2 b{display:block;font-family:var(--mono);font-size:13px;color:var(--ink)}
  .empty{padding:26px 0;font-size:12.5px;color:var(--dimmer)}

  .desc{border:1px solid var(--line);border-radius:4px;padding:14px 16px;background:var(--panel);font-size:12.5px;line-height:1.85;color:#C8D3CE}
  .desc b{color:var(--ink)}
  .bid{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid rgba(230,237,233,.07)}
  .bid .who{display:flex;gap:8px;align-items:center;font-size:12.5px;flex-wrap:wrap}
  .bid .who b{font-weight:600;cursor:pointer;border-bottom:1px dashed rgba(230,237,233,.25)}
  .bid .who b:hover{color:var(--mint);border-bottom-color:var(--mint)}
  .bid .who span{font-size:11px;color:var(--dimmer);font-family:var(--mono)}
  .lnk{margin-left:auto;font-size:11px;color:var(--mint);white-space:nowrap}
  .lnk:hover{text-decoration:underline}
  /* creator wall */
  .modal.wide{width:min(760px,100%)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 4px}
  .stats div{background:var(--panel3);border:1px solid var(--line);border-radius:3px;padding:9px 11px;font-size:11px;color:var(--dimmer)}
  .stats b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink);margin-top:2px}
  .wall{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  .wall figure{margin:0}
  .wall img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:2px;display:block}
  .wall figcaption{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.5}
  .rec{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:11.5px;color:var(--dim);padding:7px 0;border-bottom:1px solid rgba(230,237,233,.06)}
  .rec b{color:var(--ink);font-weight:600}
  .rec em{font-style:normal;color:var(--mint)}
  .rec s{text-decoration:none;color:var(--sand)}
  .bid .who{display:flex;gap:8px;align-items:center;font-size:12.5px}
  .bid .who b{font-weight:600}
  .bid .who span{font-size:11px;color:var(--dimmer);font-family:var(--mono)}
  .bid .note{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.7}
  .bid .money{text-align:right}
  .bid .money b{display:block;font-family:var(--mono);font-size:15px}
  .bid .money span{font-size:11px;color:var(--dimmer)}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(4,8,7,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
  .modal{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:20px}
  .modal h2{margin:0 0 4px;font-size:17px}
  .modal .sub{font-size:11.5px;color:var(--dim);margin-bottom:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;letter-spacing:.1em;color:var(--dimmer);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;background:var(--panel3);border:1px solid var(--line);border-radius:3px;padding:8px 10px;color:var(--ink);font-size:12.5px;outline:0}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(111,227,168,.5)}
  .field textarea{min-height:76px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

  .steps.row{display:flex;gap:10px}
  .steps.row .step{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
  .steps.row .step.on{border-color:rgba(111,227,168,.5);color:var(--mint)}
  .steps.row .step.done{border-color:rgba(111,227,168,.25)}
  .unread{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:9px;
    background:#E4572E;color:#fff;font-size:10px;font-weight:700;margin-left:6px;padding:0 4px;vertical-align:1px}
  .deliverbox{border:1px solid var(--line);border-radius:5px;background:var(--panel);overflow:hidden;margin-bottom:16px}
  .deliverbox .dh{display:flex;gap:12px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line)}
  .deliverbox .dh h3{margin:0;font-size:14px}
  .deliverbox .wm{margin-left:auto;font-size:11px;color:#C8A46A}
  .deliverbox .df{display:flex;gap:12px;align-items:center;padding:12px 16px;font-size:12px;color:var(--dim)}
  .deliverbox .df .lock{color:#C8A46A}
  .deliverbox .dl{background:var(--mint);color:#04120C;font-weight:700;border-radius:3px;padding:8px 16px;font-size:12.5px}  .chatcard{margin-top:20px;border:1px solid var(--line);border-radius:5px;background:var(--panel);overflow:hidden}
  .chat-head{display:flex;align-items:baseline;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .chat-head h3{margin:0;font-size:14px}
  .chat-head .hint{margin-left:auto;font-size:11px;color:#7F8E87}
  .chat-list{max-height:360px;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .msg{border:1px solid var(--line);border-radius:4px;padding:9px 12px;background:var(--panel2);max-width:78%}
  .msg.me{align-self:flex-end;border-color:rgba(111,227,168,.3);background:rgba(111,227,168,.06)}
  .msg .mb{display:flex;gap:8px;align-items:baseline;font-size:11px;color:#7F8E87;margin-bottom:4px}
  .msg .mb b{color:var(--ink);font-size:12px;font-weight:600}
  .msg .mt{font-size:12.5px;line-height:1.75;color:var(--ink);white-space:pre-wrap}
  .msg .mf{margin-top:6px;display:block}
  .msg .mf img{max-width:220px;border-radius:3px;border:1px solid var(--line)}
  .msg .mf.link{font-size:12px;color:var(--mint)}
  .chat-in{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel3)}
  .chat-in input#chatText{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:3px;
    padding:9px 12px;color:var(--ink);font-size:12.5px;outline:0}
  .chat-in input#chatText:focus{border-color:rgba(111,227,168,.5)}
  .chat-in .att{border:1px solid var(--line2);border-radius:3px;padding:0 12px;font-size:12px;color:var(--dim)}
  .chat-in .send{border-radius:3px;padding:0 18px;font-size:12.5px;font-weight:700;background:var(--mint);color:#04120C}  .splitbox{border:1px solid rgba(111,227,168,.28);border-radius:5px;background:rgba(111,227,168,.04);padding:12px;margin-bottom:14px}
  .sb-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .sb-h h4{margin:0;font-size:13px;color:var(--mint)}
  .sb-h span{font-size:11px;color:#7F8E87}
  .sb-grid{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .sb-grid figure{margin:0;flex:0 0 132px}
  .sb-grid .shnote{width:132px;box-sizing:border-box;margin-top:4px;background:var(--panel3);border:1px solid var(--line);border-radius:3px;padding:4px 6px;color:var(--ink);font-size:11px;outline:0}
  .sb-grid .shprompt{resize:vertical;min-height:38px;margin-top:4px;font-family:inherit}
  .sb-grid .shnote:focus{border-color:rgba(111,227,168,.5)}
  .sb-grid img{width:108px;height:61px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
  .sb-grid figcaption{display:flex;justify-content:space-between;font-size:11px;color:#8E9C95;font-family:var(--mono);margin-top:3px}
  .sb-grid figcaption b{color:var(--mint);font-weight:600}  .qrbox{width:168px;height:168px;border:1px solid var(--line2);border-radius:4px;background:#fff;padding:10px;display:grid;place-items:center}
  .qrgrid{width:100%;height:100%;background:
    repeating-conic-gradient(#0B0B0C 0% 25%, #fff 0% 50%) 50%/14px 14px;
    border-radius:2px;opacity:.88}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--mint);color:#04120C;font-size:12px;font-weight:700;padding:9px 16px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  [hidden]{display:none !important}

  /* upload */
  /* film player */
  .filmwrap{margin-bottom:16px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#000}
  .filmwrap video{width:100%;display:block;aspect-ratio:16/9;background:#000}

async function api(path, opts = {}){
  const headers = Object.assign({ 'content-type': 'application/json' }, opts.headers || {});
  if (S.token) headers.authorization = 'Bearer ' + S.token;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function quotaInfo(){
  if (S.quota) return { used: S.quota.used, limit: S.quota.limit,

  return { used: CLIENT_QUOTA.used, limit: CLIENT_QUOTA.limit, level: CLIENT_QUOTA.level };
}

const TIERS = [
  { code:'D', min:0,     max:1000,   solo:'L0', need:0 },
  { code:'C', min:1000,  max:5000,   solo:'L1', need:0 },
  { code:'B', min:5000,  max:20000,  solo:'L2', need:3 },

];
const tierOf = (q) => {
  const amt = (q.budget[0] + q.budget[1]) / 2;

  return { ok, t, reason: ok ? '' : `需 ${t.solo} · 已完成 ${t.need} 单` };
}

  return `<div class="head"><h1>上传成片</h1><span class="count">自动拆镜</span>
      <span class="right">mp4 / mov · 建议 1080p 以上 · 单条 ≤ 2GB</span></div>
    ${online ? '' : `<div class="gate" style="margin-bottom:12px">当前是纯静态页面，上传不会真的分析。
      请用 <b>http://127.0.0.1:4321/</b> 打开（本地分析服务），上传才会真跑 ffmpeg。</div>`}
    <div id="upWrap">
      <div class="drop" id="drop">
        <b>把成片拖进来</b>
        <span>会真的读取你的文件：切镜头 → 抽首帧 → 出时间码，再把结果做成一条案例</span>
        <div class="pick" id="pick">选择文件</div>
        <div class="pick" id="sample" style="margin-left:8px">用示例片试一下</div>
        <input type="file" id="fileIn" accept="video/*" hidden>
      </div>
      <div class="steps" id="steps" hidden>
        <div class="bar"><i id="prog"></i></div>
        <div id="stepList"></div>
      </div>
      <div id="upResult"></div>
    </div>`;
}

function bindUpload(){
  const pick = $('#pick'), fileIn = $('#fileIn'), drop = $('#drop'), sample = $('#sample');
  if (!pick || !drop) return;
  pick.addEventListener('click', () => fileIn.click());
  fileIn.addEventListener('change', () => { if (fileIn.files[0]) startAnalyze(fileIn.files[0]); });
  if (sample) sample.addEventListener('click', () => runSample());
  ['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) startAnalyze(f);
  });
}

function stepRows(){ return $('#stepList'); }

function analyzeStarted(){
  const drop = $('#drop'), steps = $('#steps');
  if (drop) drop.style.display = 'none';
  if (steps) steps.hidden = false;
}

function setSteps(arr){
  const list = stepRows(); if (!list) return;
  list.innerHTML = arr.map((s, i) => `<div class="step ${i === arr.length - 1 ? 'on' : 'done'}">
    <span class="tick"></span><span>${s}</span></div>`).join('');
}

function finishAnalyze(r){
  const name = (r.file || '成片.mp4').replace(/\.[^.]+$/, '');
  const total = r.shotCount || 0;
  const meta = r.meta || {};
  const coverShot = (r.shots || []).find(s => s.thumb);
  const newCase = {
    id: 'up' + Date.now(), cat: '自动拆解', title: name + '（自动拆解）',
    client: '刚上传的成片', dur: `${Math.floor((meta.duration||0)/60)}min${Math.round((meta.duration||0)%60)}s`,
    ratio: meta.w && meta.h ? (meta.w > meta.h ? '16:9' : '9:16') : '16:9',
    shotsN: total, year: '2026.11', auto: true,
    videoSrc: r.videoUrl || 'assets/film.mp4',
    cover: coverShot ? coverShot.thumb : 'assets/film-poster.jpg',
    tag: `${total} 镜 · 自动拆解`,
    price: { from: 3800, level: '标准', revisions: 2, days: 3,
      items: [['分镜与脚本',800],['首帧',1250],['合成剪辑',900],['配乐字幕',550],['项目管理',300]] },
    comments: [],
    shots: (r.shots || []).map(s => ({
      n: s.n, s: s.start, e: s.end, t: s.dur.toFixed(1) + 's',
      size: '待标注', cam: '待标注', title: '第 ' + s.n.replace('S','') + ' 镜',
      desc: '（这一镜的描述还没写：可人工补，或接视觉模型自动生成）',
      img: s.thumb, res: meta.h ? meta.h + 'p' : '1080p', ratio: meta.w > meta.h ? '16:9' : '9:16',
      prompt: '（提示词待生成）', neg: '（待补）'
    }))
  };
  CASES.unshift(newCase);
  state.tab = 'cases'; state.caseId = newCase.id; state.shot = 0;
  render();
  toast(`分析完成：${total} 镜 · 用时已记录`);
}

function pollJob(id, onDone){
  const prog = $('#prog');
  const tick = () => {
    fetch('/api/job/' + id, { cache: 'no-store' }).then(r => r.json()).then(j => {
      if (j.status === 'done'){
        if (prog) prog.style.width = '100%';
        setSteps(['上传完成', '切分镜头（场景检测）', '抽取首帧', `识别完成 · ${j.result.shotCount} 镜`]);
        setTimeout(() => {
          if (onDone) { onDone(j.result); return; }
          try { finishAnalyze(j.result); }
          catch (e) { const box = $('#upResult'); if (box) box.innerHTML = `<div class="gate">渲染失败：${esc(String(e && e.message || e))}</div>`; }
        }, 350);
        return;
      }
      if (j.status === 'error'){
        $('#upResult').innerHTML = `<div class="gate">分析失败：${esc(j.error || '未知错误')}</div>`;
        return;
      }
      const pct = j.progress || 5;
      if (prog) prog.style.width = Math.min(96, pct) + '%';
      setSteps(['上传完成', '切分镜头（场景检测）', `抽取首帧 ${pct}%`]);
      setTimeout(tick, 800);
    }).catch(() => setTimeout(tick, 1200));
  };
  setTimeout(tick, 500);
}

function startAnalyze(file, nameOverride){
  analyzeStarted();
  const nm = nameOverride || file.name || '成片.mp4';
  setSteps([`上传中 · ${nm}（${(file.size/1048576).toFixed(1)} MB）`]);
  const prog = $('#prog');
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/analyze');
  xhr.setRequestHeader('X-Filename', encodeURIComponent(nm));
  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    const pct = Math.round(e.loaded / e.total * 100);
    if (prog) prog.style.width = Math.min(20, Math.round(pct * 0.2)) + '%';
    if (pct >= 100) setSteps(['上传完成', '切分镜头（场景检测）', '抽取首帧']);
  };
  xhr.onload = () => {
    try {
      const r = JSON.parse(xhr.responseText);
      if (!r.ok || !r.jobId) throw new Error(r.error || '没有拿到任务号');
      pollJob(r.jobId);
    } catch (e) {
      $('#upResult').innerHTML = `<div class="gate">提交失败：${esc(String(e.message || e))}</div>`;
    }
  };
  xhr.onerror = () => {
    $('#upResult').innerHTML = `<div class="gate">连不上本地分析服务。请用 http://127.0.0.1:4321/ 打开本页。</div>`;
  };
  xhr.send(file);
}

function bindWorks(){
  const pick = $('#wPick'), file = $('#wFile'), drop = $('#wDrop');
  if (pick && file){
    pick.addEventListener('click', () => file.click());
    file.addEventListener('change', () => {
      const f = file.files[0];
      if (f) uploadWork(f);
    });
  }
  if (drop){
    ['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) uploadWork(f);
    });
  }
}

/* 把审核通过的真实作品并进案例库（前台可见） */
function durToSec(d){
  const s = String(d || '').trim();
  const mm = s.match(/^(\d+):(\d+)$/);
  if (mm) return Number(mm[1]) * 60 + Number(mm[2]);
  let total = 0;
  const mi = s.match(/(\d+)\s*min/i), se = s.match(/(\d+(?:\.\d+)?)\s*s/i);
  if (mi) total += Number(mi[1]) * 60;
  if (se) total += Number(se[1]);
  return total || 15;
}

function mergeDbCases(items){
  (items || []).forEach(w => {
    if (CASES.some(c => c.id === w.id)) return;
    let shots = (w.shots || []).map(s => ({
      n: s.n, s: s.s, e: s.e, t: (typeof s.s === 'number' && typeof s.e === 'number' ? (s.e - s.s).toFixed(1) : '0') + 's',
      size: '待标注', cam: '待标注', title: '镜头 ' + s.n,
      desc: (s.d && String(s.d).trim()) ? s.d : '（创作者没有填写这一镜的说明）',
      img: s.img || '', res: '1080p', ratio: w.ratio,
      prompt: (s.p && String(s.p).trim()) ? s.p : '（创作者没有填写提示词）', neg: '（待补）'
    }));
    if (!shots.length){
      const sec = durToSec(w.dur);
      shots = [{
        n: '01', s: 0, e: sec, t: sec.toFixed(1) + 's',
        size: '待标注', cam: '待标注', title: '成片全片',
        desc: '这条作品上传时没有带分镜数据，只录入了成片与报价，分镜表可以后续补录。',
        img: w.cover || '', res: '1080p', ratio: w.ratio,
        prompt: '（提示词待生成）', neg: '（待补）'
      }];
    }
    CASES.unshift({
      id: w.id, cat: w.cat, title: w.title,
      client: (w.owner || '创作者') + ' · 作品',
      dur: w.dur, ratio: w.ratio, shotsN: w.shotsN || shots.length,
      year: (w.created || '').slice(0, 7).replace('-', '.'),
      cover: w.cover || 'assets/film-poster.jpg', tag: w.tag || '',
      videoSrc: w.videoSrc || '', price: w.price,
      comments: [], shots
    });
  });
}

async function createOrder(payload){

    CURRENT_ORDER = r.order;
    CURRENT_SETTLEMENT = { gross: r.order.quote, creatorFee: r.order.creatorFee, net: r.order.creatorNet,
      clientFee: r.order.clientFee, platformFee: r.order.platformFee, status: 'pending' };
    state.tab = 'checkout'; state.caseId = null; state.rfqId = null;
    render(); $('.stage').scrollTop = 0;
  } catch (e) { toast('下单失败：' + e.message); }
}

async function payOrder(id){
  try {
    const r = await api('/api/orders/' + id + '/pay', { method: 'POST' });
    CURRENT_ORDER = r.order;
    CHAT_ORDER = r.order.id;
    render(); toast('支付成功（模拟）');
    loadChat(CHAT_ORDER); startChatPoll(CHAT_ORDER);
  } catch (e) { toast('支付失败：' + e.message); }
}

async function uploadDeliver(file){
  const id = state._deliverOrder || (CURRENT_ORDER && CURRENT_ORDER.id);
  if (!id) return toast('没有订单');
  toast('正在上传并生成水印预览…');
  try {
    const bytes = await file.arrayBuffer();
    const r = await fetch('/api/orders/' + id + '/deliver-file', {
      method: 'POST',
      headers: { 'X-Filename': encodeURIComponent(file.name), authorization: 'Bearer ' + S.token,
        'content-type': 'application/octet-stream' },
      body: bytes
    }).then(x => x.json());
    if (!r.ok) throw new Error(r.error || '上传失败');
    CURRENT_ORDER = r.order;
    render();
    toast(r.watermark ? '已交付，水印预览已生成' : '已交付（水印生成失败，先按原片预览）');
    loadOrders();
  } catch (e) { toast('交付失败：' + e.message); }
}

async function isParticipantRead(){
  if (!CHAT_ORDER || !S.online) return;
  try { await api('/api/orders/' + CHAT_ORDER + '/read', { method: 'POST' }); } catch (e) {}
  const o = MY_ORDERS.find(x => x.id === CHAT_ORDER);
  if (o) o.unread = 0;

}

async function refundOrder(id){

/* ============ 订单聊天 ============ */
let CHAT = [];
let CHAT_ORDER = null;
let chatTimer = null;

function chatBlock(){
  const cur = CURRENT_ORDER;
  if (!cur || cur.status === 'pending_pay') return '';
  const rows = CHAT.length ? CHAT.map(m => `
    <div class="msg ${m.mine ? 'me' : ''}">
      <div class="mb"><b>${esc(m.who)}</b><span>${m.role} · ${(m.time || '').slice(5, 16).replace('T', ' ')}</span></div>
      ${m.text ? `<div class="mt">${esc(m.text)}</div>` : ''}
      ${m.file ? (isImg(m.fileName)
        ? `<a class="mf" href="${m.file}" target="_blank"><img src="${m.file}" alt="${esc(m.fileName)}"></a>`
        : `<a class="mf link" href="${m.file}" target="_blank" download>📎 ${esc(m.fileName)}</a>`) : ''}
    </div>`).join('') : '<div class="empty" style="padding:10px 0">还没有消息。把参考片、脚本、字体要求的文件直接拖进来。</div>';

  return `<div class="chatcard">
    <div class="chat-head"><h3>项目沟通</h3>
      <span class="hint">付款后开放 · 双方可见 · 附件直接传</span></div>
    <div class="chat-list" id="chatList">${rows}</div>
    <div class="chat-in">
      <button class="att" data-chatfile="1">附件</button>
      <input type="file" id="chatFile" hidden>
      <input id="chatText" placeholder="说点什么，比如：院子雨声那段能再近一点吗" autocomplete="off">
      <button class="send" data-chatsend="1">发送</button>
    </div>
  </div>`;
}

const isImg = (n) => /\.(png|jpe?g|webp|gif)$/i.test(String(n || ''));

async function loadChat(orderId, silent){
  if (!S.online || !S.token) return;
  try {
    const r = await api('/api/orders/' + orderId + '/messages');
    CHAT = r.items || [];
    if (state.tab === 'checkout' && !silent) render();
    else if (state.tab === 'checkout' && silent){
      const box = document.getElementById('chatList');
      if (box){ box.innerHTML = box.innerHTML; render(); }
    }
  } catch (e) { /* ignore */ }
}

function startChatPoll(orderId){
  stopChatPoll();
  chatTimer = setInterval(() => loadChat(orderId, true), 5000);
}
function stopChatPoll(){
  if (chatTimer){ clearInterval(chatTimer); chatTimer = null; }
}

async function sendChat(){
  const el = document.getElementById('chatText');
  const text = (el && el.value || '').trim();
  if (!text) return;
  try {
    await api('/api/orders/' + CHAT_ORDER + '/messages', { method: 'POST', body: JSON.stringify({ text }) });
    CHAT.push({ who: S.user ? S.user.name : '我', role: '客户', text, mine: true, time: new Date().toISOString() });
    render();
  } catch (e) { toast('发送失败：' + e.message); }
}

async function uploadChat(file){
  if (!CHAT_ORDER) return;
  try {
    const r = await fetch('/api/orders/' + CHAT_ORDER + '/upload', {
      method: 'POST',
      headers: { 'X-Filename': encodeURIComponent(file.name), authorization: 'Bearer ' + S.token },
      body: file
    }).then(x => x.json());
    if (!r.ok) throw new Error(r.error || '上传失败');
    CHAT.push({ who: S.user ? S.user.name : '我', role: '客户', file: r.url, fileName: r.name, mine: true, time: new Date().toISOString() });
    render();
    toast('已上传：' + r.name);
  } catch (e) { toast('上传失败：' + e.message); }
}

  if (!S.online || !S.token) return;

    const r = await api('/api/deposits');

function depositCard(kindArg){
  if (!S.token) return '';
  const rows = DEPOSITS.map(d => {
    const label = d.status === 'pending' ? '待缴纳' : (d.status === 'paid' ? '已缴纳' : (d.status === 'frozen' ? '争议冻结' : '已退回'));
    const tone = d.status === 'paid' ? 'var(--mint)' : (d.status === 'frozen' ? '#E4572E' : (d.status === 'refunded' ? '#7F8E87' : '#C8A46A'));
    return `<div class="kv" style="border-top:1px solid var(--line)">
      <k>${d.no}<br><span style="color:#7F8E87;font-size:11px">${(d.created || '').slice(0, 16).replace('T', ' ')}</span></k>
      <v>${money(d.amount)}<br><span style="font-size:11px;color:${tone}">${label}</span></v>
    </div>`;
  }).join('');

  const base = kindArg === 'company' ? 5000 : 2000;
  const short = Math.max(0, base - DEP_BAL.paid - DEP_BAL.frozen);
  const action = short > 0
    ? `<button class="solid" data-deppay="${short}" style="width:100%">缴纳保证金 ${money(short)}（在线支付）</button>`
    : `<button class="ghost" data-deprefund="1" style="width:100%">申请退回保证金（原路退回）</button>`;

  return `<div class="pcard" style="margin-bottom:16px">

    <div class="sub" style="margin-bottom:10px">
      已缴 <b style="color:var(--mint)">${money(DEP_BAL.paid)}</b>${DEP_BAL.frozen ? ` · 冻结 <b style="color:#E4572E">${money(DEP_BAL.frozen)}</b>` : ''}
      ${DEP_BAL.refunded ? ` · 已退 ${money(DEP_BAL.refunded)}` : ''} · 建议额度 ${money(base)}
      <br>个人接 C 级及以上订单必须先缴纳；企业可免（按单 8%）或缴纳。退回时走原路退回，有在途订单时不可退。
    </div>
    ${action}
    ${DEPOSITS.length ? `<div style="margin-top:12px">${rows}</div>` : ''}
  </div>`;
}


async function refundDeposit(){

      <input id="pDeposit" type="number" value="${p ? p.deposit : (company ? 5000 : 2000)}"></div>

  return `<div class="head"><h1>${state.role === 'client' ? (company ? '企业认证' : '实名认证') : '入驻资料'}</h1><span class="count">${company ? '企业' : '个人'}</span>

async function loadProfile(){
  if (!S.online || !S.token) return;
  try {
    const r = await api('/api/my/profile');
    MY_PROFILE = r.profile || null;
    MY_PROFILE_LOADED = true;
    if (state.tab === 'profile') render();
  } catch (e) { /* ignore */ }
}

async function submitProfile(){
  if (!S.online || !S.token) return toast('请先登录');
  const kind = ((state.role === 'client' ? state.clientKind === 'person' : state.role === 'solo') ? 'solo' : 'company');
  const company = kind === 'company';
  const name = ($('#pName').value || '').trim();
  const license = ($('#pLicense').value || '').trim();
  const bank = ($('#pBank').value || '').trim();
  const deposit = Number($('#pDeposit').value) || 0;
  if (!name) return toast('名称不能为空');
  if (!license) return toast(company ? '营业执照号必填' : '身份证后四位必填');
  if (!bank) return toast(company ? '对公账户必填' : '收款银行卡必填');
  const body = {
    kind, name, licenseNo: license, bank, deposit,
    invoiceReady: company ? !!($('#pInvoice') && $('#pInvoice').checked) : false,
    realname: company ? true : !!($('#pRealname') && $('#pRealname').checked)
  };
  try {
    const r = await api('/api/profiles', { method: 'POST', body: JSON.stringify(body) });
    MY_PROFILE = r.profile;
    if (S.user) S.user.kind = kind;
    render();
    toast('已提交，等待商务审核');
  } catch (e) { toast('提交失败：' + e.message); }
}

/* ============ 渲染 ============ */
function render(){
  renderChrome();
  let html = '';
  if (state.tab === 'cases') html = state.caseId ? viewCase() : viewCases();
  else if (state.tab === 'upload') html = viewUpload();
  else if (state.tab === 'works') html = viewWorks();
  else if (state.tab === 'profile') html = viewProfile();
  else if (state.tab === 'orders') html = viewOrders();
  else if (state.tab === 'checkout') html = viewCheckout();
  else if (state.tab === 'depositpay') html = viewDepositPay();
  else if (state.tab === 'entry') html = viewEntry();
  else if (state.tab === 'rfq') html = state.rfqId ? viewRfq() : viewRfqs();
  else html = viewMine();
  view.innerHTML = html;
  if (state.tab === 'upload') bindUpload();
  if (state.tab === 'works') bindWorks();
  if (state.tab === 'checkout'){
    const df = document.getElementById('deliverFile');
    if (df && !df._bound01){ df._bound01 = true; df.addEventListener('change', () => { if (df.files[0]) uploadDeliver(df.files[0]); }); }
  }

  if (state.tab === 'cases' && state.caseId){ const c = currentCase(); if (c && (c.auto || c.videoSrc)) bindFilm(c); }
}

async function submitPost(){
  const qi = quotaInfo();
  if (state.clientKind === 'person' && qi.limit - qi.used <= 0){
    closeModal();
    openModal(`<h2>本月发布额度已用完</h2>
      <div class="sub">${qi.level} 个人客户每月可发 ${qi.limit} 单，已用 ${qi.used} 单。</div>
      <div class="desc">额度按履约结果提升：完成 2 单且无争议 → 5 单/月；完成 5 单且评分 ≥ 4.5 → 10 单/月。</div>
      <div class="actions"><button class="solid" data-close>知道了</button></div>`);
    return;
  }
  const title = ($('#pTitle2').value || '').trim() || '新需求';
  const cat = $('#pCat').value;
  const budget = Number($('#pBudget').value) || 800;
  const payload = {
    title, cat, dur: $('#pDur').value, ratio: '9:16', level: '标准',
    budget: [Math.round(budget * 0.9), Math.round(budget * 1.1)],
    desc: ($('#pDesc').value || '').trim() || '按需求说明执行。'
  };

  if (S.online){
    try {
      const r = await api('/api/rfqs', { method: 'POST', body: JSON.stringify(payload) });
      if (r.rfq) RFQS.unshift(r.rfq);
      if (r.quota) S.quota = r.quota;
    } catch (e) {
      if (String(e.message).includes('入驻资料')){
        closeModal();
        state.tab = 'profile'; state.caseId = null; render(); loadProfile();
        toast(state.role === 'client' ? '发布需求前需要先完成认证' : '先补入驻资料：' + e.message);
      } else {
        toast('发布失败：' + e.message);
      }
      return;
    }
  } else {
    RFQS.unshift({ id: 'q' + Date.now(), client: clientName(), ...payload,
      deadline: '5 天后截止', refCase: null, lic: cat === 'AI 二创', bids: [] });
    if (state.clientKind === 'person') CLIENT_QUOTA.used++;
  }

  closeModal(); state.tab = 'mine'; state.caseId = null;
  render();
  const q2 = quotaInfo();
  toast(state.clientKind === 'person' ? `需求已发布 · 本月还剩 ${Math.max(0, q2.limit - q2.used)} 单额度` : '需求已发布，制作方可以报价了');
}

/* ============ 事件 ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-case],[data-back],[data-shot],[data-inquiry],[data-cmt],[data-bid],[data-close],[data-submit-inquiry],[data-submit-bid],[data-submit-post],[data-rfq],[data-provider],[data-clientkind],[data-profile],[data-wsubmit],[data-psubmit],[data-pkind],[data-orderbid],[data-checkout],[data-pay],[data-deliver],[data-deliverfile],[data-accept],[data-refund],[data-share],[data-deppay],[data-deppaynow],[data-deprefund],[data-chatsend],[data-chatfile]');
  if (!t) return;

  if (t.dataset.profile){ openProfile(t.dataset.profile); return; }

  if (t.dataset.clientkind !== undefined){ state.clientKind = t.dataset.clientkind; state.tab = 'cases'; state.caseId = null; state.rfqId = null; render(); return; }
  if (t.dataset.provider !== undefined){ state.provider = t.dataset.provider; render(); return; }

  if (t.dataset.tab){
    state.tab = t.dataset.tab; state.caseId = null; state.rfqId = null;
    render(); $('.stage').scrollTop = 0;
    if (state.tab === 'works') loadWorks();
    if (state.tab === 'profile'){ loadProfile(); loadDeposits(); }
    if (state.tab === 'orders') loadOrders();
    if (state.tab === 'checkout' && CURRENT_ORDER){
      CHAT_ORDER = CURRENT_ORDER.id;
      if (CURRENT_ORDER.status !== 'pending_pay'){ loadChat(CHAT_ORDER); startChatPoll(CHAT_ORDER); }
      else stopChatPoll();
    }
    return;
  }
  if (t.dataset.rfq){ state.tab = 'rfq'; state.rfqId = t.dataset.rfq; render(); $('.stage').scrollTop = 0; loadRfq(t.dataset.rfq); return; }
  if (t.dataset.case){ state.tab = 'cases'; state.caseId = t.dataset.case; state.shot = 0; render(); $('.stage').scrollTop = 0; loadComments(t.dataset.case); return; }
  if (t.dataset.back !== undefined){ state.caseId = null; state.rfqId = null; render(); $('.stage').scrollTop = 0; return; }
  if (t.dataset.shot){
    state.shot = Number(t.dataset.shot);
    paintShot();
    const c = currentCase();
    if (c && c.auto){
      const v = document.getElementById('film'), s = c.shots[state.shot];
      if (v && s && s.s !== undefined){ v.currentTime = s.s + 0.05; v.play().catch(() => {}); }
    }
    return;
  }
  if (t.dataset.inquiry){ inquiryModal(t.dataset.inquiry); return; }
  if (t.dataset.bid){ bidModal(t.dataset.bid); return; }
  if (t.dataset.close !== undefined){ closeModal(); return; }
  if (t.dataset.cmt){ addComment(t.dataset.cmt); return; }
  if (t.dataset.submitInquiry){ submitInquiry(t.dataset.submitInquiry); return; }
  if (t.dataset.submitBid){ submitBid(t.dataset.submitBid); return; }
  if (t.dataset.submitPost){ submitPost(); return; }
  if (t.dataset.wsubmit){ submitWork(); return; }
  if (t.dataset.orderbid){
    const [creator, price, days, title] = t.dataset.orderbid.split('|');
    createOrder({ creator, quote: Number(price), days: Number(days), title });
    return;
  }
  if (t.dataset.checkout){ state.tab = 'checkout'; render(); loadCheckout(t.dataset.checkout); return; }
  if (t.dataset.pay){ payOrder(t.dataset.pay); return; }
  if (t.dataset.chatsend){ sendChat(); return; }
  if (t.dataset.chatfile){ const f = document.getElementById('chatFile'); if (f) f.click(); return; }
  if (t.dataset.deliverfile){
    state._deliverOrder = t.dataset.deliverfile;
    const inp = document.getElementById('deliverFile');
    if (inp){ inp.click(); } else { toast('请先回到收银台页面'); }
    return;
  }
  if (t.dataset.deliver){ deliverOrder(t.dataset.deliver); return; }
  if (t.dataset.accept){ acceptOrder(t.dataset.accept); return; }
  if (t.dataset.refund){ refundOrder(t.dataset.refund); return; }
  if (t.dataset.deppay){ payDeposit(t.dataset.deppay); return; }
  if (t.dataset.deppaynow){ payDepositNow(t.dataset.deppaynow); return; }
  if (t.dataset.deprefund){ refundDeposit(); return; }
  if (t.dataset.share){ shareOrder(t.dataset.share); return; }
  if (t.dataset.psubmit){ submitProfile(); return; }
  if (t.dataset.pkind !== undefined){ state.profileKind = t.dataset.pkind; if (S.user) S.user.kind = t.dataset.pkind; render(); return; }
});

/* ============ 启动 ============ */
async function boot(){
  const forceLogin = new URLSearchParams(location.search).get('login') === '1';
  try { await api('/api/health'); S.online = true; } catch (e) { S.online = false; }

  if (S.online){
    // 公开数据先拉，与是否登录无关
    try {
      const list = await api('/api/rfqs');
      (list.items || []).forEach(it => { if (!RFQS.some(x => x.id === it.id)) RFQS.unshift(it); });
    } catch (e) { /* 拉不到就退回演示数据 */ }
    try {
      const cs = await api('/api/cases');
      mergeDbCases(cs.items || []);
    } catch (e) { /* ignore */ }

    const t = forceLogin ? null : localStorage.getItem(TOKEN_KEY);
    if (t){
      S.token = t;
      try {
        const me = await api('/api/me');
        S.user = me.user; S.quota = me.quota;
      } catch (e) { S.token = null; localStorage.removeItem(TOKEN_KEY); }
    }
    if (!S.token) showLogin();
  } else {
    showLogin();
  }
  if (forceLogin) showLogin();

  render();
  const deep = location.hash.match(/^#case=([\w-]+)/);
  if (deep && caseById(deep[1])){
    state.tab = 'cases'; state.caseId = deep[1]; render(); loadComments(deep[1]);
  }
  if (location.hash.startsWith('#demo-upload')){
    state.role = 'studio'; state.tab = 'upload'; render();
  }
}

boot();
</script>
</body>
</html>
